name: Generate real contribution snake (manual)

# 샘플 모드에서는 실제 기여 그래프를 자동 갱신하지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SVGs from the real contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23FACC15
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FACC15
      - name: Add accessible static alternatives
        run: python3 .github/scripts/prepare_snake.py
      - name: Publish generated assets without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin output; then
            git fetch origin output
            git switch --create output --track origin/output
          else
            git switch --orphan output
          fi
          cp dist/*.svg .
          git add github-snake-animated.svg github-snake-dark-animated.svg github-snake.svg github-snake-dark.svg github-snake-static.svg github-snake-dark-static.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update contribution snake assets'
          git push origin HEAD:output
